<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>florian | profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --card: rgba(8, 8, 12, .34);
    --chip: rgba(255, 255, 255, .05);
    --line: rgba(255, 255, 255, .09);
    --text: #f3f3f7;
    --muted: #8d8d9c;
    --accent: #8b7cff;
    --accent-soft: rgba(139, 124, 255, .18);
    --online: #3ba55d;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    overflow-x: hidden;
    overflow-y: auto;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .video {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
    object-fit: cover; background: #000;
  }
  .veil {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(110% 85% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45));
  }
  .sound {
    position: fixed; z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; padding: 0;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2); color: var(--text);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; transition: background .2s;
  }
  .sound:hover { background: var(--accent-soft); }
  .sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sound svg { width: 20px; height: 20px; }
  .sound[hidden] { display: none; }
  .glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% 0%, var(--accent-soft), transparent 70%),
      radial-gradient(50% 40% at 50% 100%, rgba(139, 124, 255, .08), transparent 70%);
  }

  /* ---------- Splash ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: var(--bg);
    border: 0; width: 100%; padding: 0;
    color: var(--muted);
    font: 500 1.05rem/1 var(--font);
    letter-spacing: .04em;
    cursor: pointer;
    transition: opacity .7s ease, visibility .7s;
  }
  .splash span { animation: breathe 2.6s ease-in-out infinite; }
  .splash:focus-visible { outline: 2px solid var(--accent); outline-offset: -8px; }
  .gone .splash { opacity: 0; visibility: hidden; pointer-events: none; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 1;
    min-height: 100%;
    display: grid; place-items: center;
    padding: 64px 16px 28px;
  }
  .tilt { width: min(430px, 100%); transition: transform .15s ease-out; will-change: transform; }
  .card {
    opacity: 0;
    padding: 30px 24px 24px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    box-shadow: 0 0 90px -20px rgba(139, 124, 255, .35), 0 30px 60px -30px #000;
    text-align: center;
  }
  .gone .card { animation: enter .9s cubic-bezier(.2, .8, .2, 1) .15s forwards; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(18px) scale(.97); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  /* ---------- Avatar ---------- */
  .avatar {
    width: 108px; height: 108px; margin: 0 auto 16px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 210deg, var(--accent), #4b3fd6, #b9b2ff, var(--accent));
  }
  .avatar {
    display: block; border: 0; cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
  }
  .avatar:hover { transform: scale(1.05); box-shadow: 0 0 34px -4px rgba(139,124,255,.6); }
  .avatar:active { transform: scale(.97); }
  .avatar:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .toast {
    position: fixed; z-index: 6; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    padding: 10px 16px; border-radius: 999px;
    background: rgba(12,12,18,.85); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: .88rem; font-weight: 700; white-space: nowrap;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .avatar > * {
    width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
    background: #0b0b12; object-fit: cover;
    font-weight: 800; font-size: 2.6rem; color: var(--text);
  }

  h1 {
    margin: 0;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 1.85rem; font-weight: 800; letter-spacing: -.02em;
  }
  h1 svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .uid {
    display: inline-block; margin-top: 8px;
    padding: 3px 10px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--line);
    font-size: .78rem; font-weight: 700; color: var(--muted);
  }

  .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 4px; }
  .badge {
    width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--chip); border: 1px solid var(--line);
    color: var(--accent);
  }
  .badge svg { width: 17px; height: 17px; }

  .stats {
    display: flex; justify-content: center; gap: 20px;
    margin: 16px 0 6px;
    color: var(--muted); font-size: .88rem; font-weight: 500;
  }
  .stats div { display: inline-flex; align-items: center; gap: 6px; }
  .stats svg { width: 15px; height: 15px; }

  .bio { text-shadow: 0 1px 10px rgba(0,0,0,.8); min-height: 1.6em; margin: 14px 0 22px; font-size: 1rem; color: var(--text); font-weight: 500; }
  .bio::after {
    content: ""; display: inline-block; width: 2px; height: 1.05em; margin-left: 3px;
    background: var(--accent); vertical-align: -.15em;
    animation: caret 1s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---------- Liens ---------- */
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .links > * {
    display: flex; align-items: center; gap: 10px; min-width: 0; width: 100%;
    padding: 10px 12px; border-radius: 14px; text-align: left;
    background: var(--chip); border: 1px solid var(--line);
    color: var(--text); text-decoration: none; font: inherit; cursor: pointer;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .tile {
    width: 36px; height: 36px; flex: none; border-radius: 10px;
    display: grid; place-items: center; border: 1px solid rgba(255,255,255,.12);
  }
  .tile svg { width: 19px; height: 19px; fill: #fff; }
  .links .txt { min-width: 0; }
  .links b { display: block; font-weight: 800; font-size: .9rem; overflow-wrap: anywhere; line-height: 1.2; }
  .links small {
    display: block; margin-top: 1px; color: var(--muted); font-weight: 500; font-size: .76rem;
    line-height: 1.25; overflow-wrap: anywhere;
  }
  .links > *:hover { background: var(--accent-soft); border-color: rgba(139, 124, 255, .45); transform: translateY(-1px); }
  .links > *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 330px) { .links { grid-template-columns: 1fr; } }

  /* ---------- Présence Discord ---------- */
  .presence {
    margin-top: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; text-align: left;
    border-radius: 16px; background: rgba(0, 0, 0, .38); border: 1px solid var(--line);
  }
  .p-head { display: flex; align-items: center; gap: 12px; }
  .p-avatar { position: relative; width: 46px; height: 46px; flex: none; }
  .p-avatar > .img {
    width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #4b3fd6, var(--accent)); font-weight: 800; overflow: hidden;
  }
  .p-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .dot {
    position: absolute; right: -2px; bottom: -2px;
    width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid #0c0c12; background: var(--online);
  }
  .dot.idle { background: #f0b232; } .dot.dnd { background: #f23f43; } .dot.offline { background: #80848e; }
  .p-text { min-width: 0; }
  .p-name { font-weight: 800; font-size: .95rem; }
  .p-sub { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .p-sub[hidden] { display: none; }
  .acts { display: grid; gap: 8px; }
  .act-none { color: var(--muted); font-size: .84rem; }
  .act {
    display: flex; gap: 12px; align-items: center; padding: 10px;
    border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line);
  }
  .act-art { position: relative; width: 66px; height: 66px; flex: none; }
  .act-art > img:first-child { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; display: block; background: rgba(255,255,255,.08); }
  .act-small {
    position: absolute; right: -5px; bottom: -5px; width: 24px; height: 24px;
    border-radius: 50%; object-fit: cover; border: 2px solid #15151d; background: #15151d;
  }
  .act-body { min-width: 0; flex: 1; }
  .act-label { color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-title { font-weight: 800; font-size: .92rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-line { color: #c9c9d4; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.act { color: inherit; text-decoration: none; cursor: pointer; transition: background .2s, border-color .2s; }
  a.act:hover { background: rgba(139,124,255,.12); border-color: rgba(139,124,255,.45); }
  a.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .act-go { flex: none; width: 18px; height: 18px; color: var(--muted); }
  .act-ep {
    display: block; width: fit-content; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 4px; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: #dcd8ff; font-size: .78rem; font-weight: 800;
  }
  .act-time { color: var(--accent); font-size: .78rem; font-weight: 700; margin-top: 3px; }
  .act-bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden; }
  .act-fill { height: 100%; width: 0; background: var(--accent); }

  @media (min-width: 760px) {
    .tilt { width: min(520px, 100%); }
    .links { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-height: 560px) and (orientation: landscape) { main { padding-top: 60px; } }
  @media (max-width: 380px) {
    .card { padding: 26px 16px 18px; }
    h1 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash span, .bio::after { animation: none; }
    .gone .card { animation: none; opacity: 1; }
    .tilt, .links > *, .avatar, .toast { transition: none; }
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<button class="splash" id="splash" type="button"><span>clique pour entrer</span></button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<video class="video" id="vid" loop playsinline preload="auto" aria-hidden="true" ></video>
<div class="veil" aria-hidden="true"></div>
<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Couper le son" hidden></button>

<main>
  <div class="tilt" id="tilt">
    <section class="card" aria-label="Profil">
      <button class="avatar" id="avatar" type="button" aria-label="Copier mon pseudo Discord" title="Copier mon Discord"></button>
      <h1 id="name"></h1>
      <div><span class="uid" id="uid"></span></div>
      <div class="badges" id="badges"></div>
      <div class="stats">
        <div id="views"></div>
        <div id="place"></div>
      </div>
      <p class="bio" id="bio" aria-live="off"></p>
      <nav class="links" id="links" aria-label="Liens"></nav>
      <div class="presence" id="presence"></div>
    </section>
  </div>
</main>

const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}
async function copyText(txt, label) {
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy"); ta.remove();
    } catch (e) {}
  }
  toast(label + (ok ? " copié : " : " : ") + txt);
  return ok;
}
const copyDiscord = () => copyText(CONFIG.discordTag, "Discord");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* --- Contenu --- */
document.title = CONFIG.username + " | profil";
const letter = (CONFIG.username[0] || "?").toUpperCase();

function setBigAvatar(url) {
  const box = $("avatar");
  box.textContent = "";
  const fallback = () => {
    if (url !== CONFIG.avatar && CONFIG.avatar) return setBigAvatar(CONFIG.avatar);
    box.textContent = "";
    const d = document.createElement("div"); d.textContent = letter; box.appendChild(d);
  };
  if (!url) return fallback();
  const img = new Image();
  img.alt = "Avatar de " + CONFIG.username;
  img.onerror = fallback;
  img.src = url;
  box.appendChild(img);
}
setBigAvatar(CONFIG.avatar);

$("avatar").addEventListener("click", copyDiscord);
$("name").innerHTML = "";
const nameNode = document.createTextNode(CONFIG.username);
$("name").append(nameNode);
if (CONFIG.badges.some(b => b.type === "verified")) {
  $("name").insertAdjacentHTML("beforeend", ICONS.verified.replace("<svg", '<svg aria-label="Vérifié" role="img"'));
}
$("uid").textContent = CONFIG.chip;

CONFIG.badges.forEach(b => {
  const el = document.createElement("span");
  el.className = "badge";
  el.title = b.label;
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", b.label);
  el.innerHTML = ICONS[b.type] || ICONS.early;
  $("badges").appendChild(el);
});

/* Compteur de vues : propre à chaque navigateur (localStorage) */
function countView() {
  try {
    let n = parseInt(localStorage.getItem("profil-vues") || String(CONFIG.startViews), 10);
    if (isNaN(n)) n = CONFIG.startViews;
    n += 1;
    localStorage.setItem("profil-vues", String(n));
    return n;
  } catch (e) { return CONFIG.startViews; }
}
$("views").innerHTML = ICONS.eye + "<span>" + (function(n){ return n.toLocaleString("fr-FR") + (n > 1 ? " vues" : " vue"); })(countView()) + "</span>";
$("place").innerHTML = ICONS.pin + "<span></span>";
$("place").lastChild.textContent = CONFIG.location;

let discordNote = null;
const ALIAS = { twitter: "x", battlenet: "battledotnet", epic: "epicgames", riot: "riotgames", psn: "playstation", ps: "playstation",
  yt: "youtube", ytb: "youtube", insta: "instagram", tt: "tiktok", amazon: "amazonmusic", apple: "applemusic", mal: "myanimelist", fb: "facebook" };
function logoFor(l) {
  const k = String(l.icon || l.label).toLowerCase().replace(/[^a-z0-9]/g, "");
  return LOGOS[ALIAS[k] || k] || null;
}
function buildLink(l) {
  const note = l.label === "Discord" ? CONFIG.discordTag : (l.note || "");
  const el = document.createElement(l.url ? "a" : "button");
  if (l.url) { el.href = l.url; el.target = "_blank"; el.rel = "noopener noreferrer"; }
  else el.type = "button";
  const L = logoFor(l);
  const tile = document.createElement("span"); tile.className = "tile";
  if (L) {
    tile.style.background = L.bg;
    tile.innerHTML = '<svg style="fill:' + (L.fg || "#fff") + '" viewBox="' + L.vb + '" aria-hidden="true"><path d="' + L.d + '"/></svg>';
  } else {
    tile.style.background = "#2a2a36"; tile.style.fontWeight = "800";
    tile.textContent = (l.label[0] || "?").toUpperCase();
  }
  const txt = document.createElement("span"); txt.className = "txt";
  const t = document.createElement("b"); t.textContent = l.label;
  const s = document.createElement("small"); s.textContent = note;
  txt.append(t, s);
  if (l.label === "Discord") discordNote = s;
  el.append(tile, txt);
  if (!l.url) {
    el.title = "Copier";
    el.addEventListener("click", async () => {
      const val = l.label === "Discord" ? CONFIG.discordTag : l.note;
      await copyText(val, l.label);
      s.textContent = "copié";
      setTimeout(() => { s.textContent = val; }, 1400);
    });
  }
  return el;
}
let linkSig = null;
function renderLinks(extra) {
  const sig = JSON.stringify(extra || []);
  if (sig === linkSig) return;
  linkSig = sig; discordNote = null;
  const box = $("links"); box.textContent = "";
  const seen = new Set();
  CONFIG.links.concat(extra || []).forEach(l => {
    const key = (l.label + "|" + (l.note || "") + "|" + (l.url || "")).toLowerCase();
    if (seen.has(key)) return;
    seen.add(key); box.appendChild(buildLink(l));
  });
}
// Liens ajoutés depuis Discord (Lanyard KV, clé "links") :  Label|pseudo|https://lien ; Label2|pseudo2
function parseLinks(raw) {
  if (!raw) return [];
  raw = String(raw).trim();
  try {
    const j = JSON.parse(raw);
    if (Array.isArray(j)) return j.map(x => ({ label: String(x.label || ""), note: String(x.note || ""), url: /^https?:\/\//i.test(x.url || "") ? x.url : "", icon: x.icon })).filter(x => x.label);
  } catch (e) {}
  return raw.split(/[;\n]+/).map(s => s.trim()).filter(Boolean).slice(0, 60).map(s => {
    const p = s.split("|").map(x => x.trim());
    const isUrl = v => /^https?:\/\//i.test(v || "");
    if (isUrl(p[1])) {
      let host = ""; try { host = new URL(p[1]).hostname.replace(/^www\./, ""); } catch (e) {}
      return { label: p[0], note: p[2] || host, url: p[1] };
    }
    return { label: p[0], note: p[1] || "", url: isUrl(p[2]) ? p[2] : "" };
  }).filter(x => x.label);
}
renderLinks([]);

/* --- Carte de présence : statique, ou en direct via Lanyard (comme sur Discord) --- */
const presence = (function () {
  const d = CONFIG.discord, root = $("presence");
  const head = document.createElement("div"); head.className = "p-head";
  const av = document.createElement("div"); av.className = "p-avatar";
  const img = document.createElement("div"); img.className = "img";
  const dot = document.createElement("span"); dot.className = "dot online";
  av.append(img, dot);
  const tx = document.createElement("div"); tx.className = "p-text";
  const nm = document.createElement("div"); nm.className = "p-name"; nm.textContent = d.name;
  const st = document.createElement("div"); st.className = "p-sub"; st.hidden = true;
  tx.append(nm, st);
  head.append(av, tx);
  const list = document.createElement("div"); list.className = "acts";
  root.append(head, list);

  let timers = [];
  setInterval(() => timers.forEach(f => f()), 1000);
  const two = n => String(n).padStart(2, "0");
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? h + ":" + two(m) + ":" + two(s) : m + ":" + two(s);
  }
  function setAvatar(url) {
    img.textContent = "";
    if (!url) { img.textContent = letter; return; }
    const i = new Image(); i.alt = ""; i.src = url;
    i.onerror = () => { i.remove(); img.textContent = letter; };
    img.appendChild(i);
  }
  function card(a) {
    const c = document.createElement(a.link ? "a" : "div"); c.className = "act";
    if (a.link) { c.href = a.link; c.target = "_blank"; c.rel = "noopener noreferrer"; c.title = "Ouvrir"; }
    if (a.img) {
      const art = document.createElement("div"); art.className = "act-art";
      const im = new Image(); im.alt = a.imgText || ""; im.src = a.img; im.onerror = () => art.remove();
      art.appendChild(im);
      if (a.small) {
        const sm = new Image(); sm.alt = ""; sm.className = "act-small"; sm.src = a.small;
        sm.onerror = () => sm.remove(); art.appendChild(sm);
      }
      c.appendChild(art);
    }
    const body = document.createElement("div"); body.className = "act-body";
    const lab = document.createElement("div"); lab.className = "act-label";
    lab.textContent = ((a.label ? a.label + " " : "") + a.name).trim();
    body.appendChild(lab);
    const addLine = (cls, txt) => {
      const l = document.createElement("div"); l.className = cls; l.textContent = txt; body.appendChild(l);
    };
    if (a.details) addLine("act-title", a.details);
    if (a.ep) {
      addLine("act-ep", a.ep.label);
      if (a.ep.rest) addLine("act-line", a.ep.rest);
    } else if (a.state) addLine("act-line", a.state);
    if (a.start) {
      const t = document.createElement("div"); t.className = "act-time";
      let fill = null;
      if (a.end) {
        const bar = document.createElement("div"); bar.className = "act-bar";
        fill = document.createElement("div"); fill.className = "act-fill"; bar.appendChild(fill);
        body.append(bar);
      }
      body.appendChild(t);
      const tick = () => {
        const now = Date.now();
        if (a.end) {
          const tot = (a.end - a.start) / 1000, cur = Math.min(tot, (now - a.start) / 1000);
          fill.style.width = (tot ? cur / tot * 100 : 0) + "%";
          t.textContent = fmt(cur) + " / " + fmt(tot);
        } else t.textContent = fmt((now - a.start) / 1000) + " écoulé";
      };
      tick(); timers.push(tick);
    }
    c.appendChild(body);
    if (a.link) {
      const go = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      go.setAttribute("viewBox", "0 0 24 24"); go.setAttribute("class", "act-go"); go.setAttribute("aria-hidden", "true");
      go.innerHTML = '<path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
      c.appendChild(go);
    }
    return c;
  }
  function render(s) {
    dot.className = "dot " + (s.status || "offline");
    dot.title = s.status || "";
    st.textContent = s.text || ""; st.hidden = !s.text;
    list.textContent = ""; timers = [];
    if (!s.activities || !s.activities.length) {
      const n = document.createElement("div"); n.className = "act-none"; n.textContent = "Aucune activité";
      list.appendChild(n); return;
    }
    s.activities.slice(0, 3).forEach(a => list.appendChild(card(a)));
  }
  return { setAvatar, setName: t => { nm.textContent = t; }, render };
})();

(function livePresence() {
  const d = CONFIG.discord;
  presence.setAvatar(d.avatar);
  const staticState = {
    status: d.status, text: "",
    activities: d.activity ? [{ label: d.activityLabel, name: d.activity }] : []
  };
  presence.render(staticState);
  if (!d.lanyardId) return;

  const LABELS = { 0: "Joue à", 1: "Diffuse", 2: "Écoute", 3: "Regarde", 5: "Participe à" };
  // Convertit les images d'activité Discord (Rich Presence) en adresses utilisables
  function imgUrl(a, key) {
    const v = a.assets && a.assets[key];
    if (!v) return "";
    if (v.indexOf("mp:external/") === 0) return "https://media.discordapp.net/external/" + v.slice(12);
    if (v.indexOf("mp:") === 0) return "https://media.discordapp.net/" + v.slice(3);
    if (v.indexOf("spotify:") === 0) return "https://i.scdn.co/image/" + v.slice(8);
    if (v.indexOf("youtube:") === 0) return "https://i.ytimg.com/vi/" + v.slice(8) + "/hqdefault.jpg";
    if (a.application_id) return "https://cdn.discordapp.com/app-assets/" + a.application_id + "/" + v + ".png";
    return "";
  }
  let lastAvatar = "";
  // Cherche « S3 E12 », « Episode 12 », « Épisode 12 »… dans le texte de l'activité
  function parseEp(txt) {
    if (!txt) return null;
    const m = txt.match(/(?:S(?:aison|eason)?\s*(\d+))?\D{0,3}(?:E|Ep|Ép|Episode|Épisode)\.?\s*(\d+)/i);
    if (!m) return null;
    const rest = txt.replace(m[0], "").replace(/^[\s·:\-–—,]+|[\s·:\-–—,]+$/g, "");
    return { label: (m[1] ? "Saison " + m[1] + " · " : "") + "Épisode " + m[2], rest: rest };
  }
  // Discord n'envoie pas l'adresse exacte de la page : Crunchyroll => recherche du titre
  function linkFor(a, data) {
    if (a.url) return a.url;
    if (a.name === "Spotify" && data.spotify && data.spotify.track_id) return "https://open.spotify.com/track/" + data.spotify.track_id;
    if (/crunchyroll/i.test(a.name || "") && a.details) return "https://www.crunchyroll.com/search?q=" + encodeURIComponent(a.details);
    return "";
  }
  function fromLanyard(data) {
    if (!data) return staticState;
    const u = data.discord_user;
    if (u) {
      if (u.avatar) {
        const url = "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + (u.avatar.indexOf("a_") === 0 ? ".gif" : ".png") + "?size=256";
        if (url !== lastAvatar) { lastAvatar = url; presence.setAvatar(url); setBigAvatar(url); }
      }
      if (u.username && u.username !== CONFIG.discordTag) {
        CONFIG.discordTag = u.username;
        nameNode.nodeValue = u.username;
        document.title = u.username + " | profil";
        presence.setName(u.username);
        if (discordNote) discordNote.textContent = u.username;
      }
    }
    renderLinks(parseLinks(data.kv && data.kv.links));
    const acts = data.activities || [];
    const custom = acts.find(a => a.type === 4);            // statut personnalisé
    const text = custom ? (((custom.emoji && !custom.emoji.id ? custom.emoji.name + " " : "") + (custom.state || "")).trim()) : "";
    return {
      status: data.discord_status || "offline",
      text: text,
      activities: acts.filter(a => a.type !== 4).map(a => ({
        label: LABELS[a.type] || "", name: a.name || "",
        details: a.details, state: a.state,
        img: imgUrl(a, "large_image") || (a.name === "Spotify" && data.spotify ? data.spotify.album_art_url : ""),
        imgText: a.assets && a.assets.large_text,
        small: imgUrl(a, "small_image"),
        start: a.timestamps && a.timestamps.start, end: a.timestamps && a.timestamps.end,
        ep: (a.type === 3 || /crunchyroll|anime|adn|wakanim|netflix|voiranime/i.test(a.name || "")) ? parseEp(a.state) : null,
        link: linkFor(a, data)
      }))
    };
  }
  async function poll() {
    try {
      const r = await fetch("https://api.lanyard.rest/v1/users/" + d.lanyardId);
      const j = await r.json();
      if (j && j.success) presence.render(fromLanyard(j.data));
    } catch (e) { /* hors ligne : on garde l'affichage actuel */ }
  }
  poll();
  try {
    let hb;
    const ws = new WebSocket("wss://api.lanyard.rest/socket");
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.op === 1) {
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: d.lanyardId } }));
        hb = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval);
      } else if (m.op === 0) presence.render(fromLanyard(m.d));
    };
    ws.onclose = () => { clearInterval(hb); setInterval(poll, 30000); };
  } catch (e) { setInterval(poll, 30000); }
})();


/* --- Machine à écrire --- */
(function typewriter() {
  const el = $("bio"), lines = CONFIG.bio;
  if (reduce || lines.length === 1) { el.textContent = lines[0]; return; }
  let li = 0, ci = 0, del = false;
  (function tick() {
    const t = lines[li];
    if (!del) {
      ci++; el.textContent = t.slice(0, ci);
      if (ci === t.length) { del = true; return setTimeout(tick, 1900); }
      return setTimeout(tick, 65);
    }
    ci--; el.textContent = t.slice(0, ci);
    if (ci === 0) { del = false; li = (li + 1) % lines.length; return setTimeout(tick, 320); }
    setTimeout(tick, 30);
  })();
})();

/* --- Vidéo de fond + son --- */
const vid = $("vid"), snd = $("sound");
/* Vidéo adaptée à l'écran : vertical (téléphone/tablette portrait) ou horizontal (PC/paysage) */
const VIDEO_V = "bg-v.mp4", VIDEO_H = "bg-h.mp4";
let triedAlt = false;
const wantSrc = () => (innerHeight >= innerWidth ? VIDEO_V : VIDEO_H);
function setVideo(src, keep) {
  const t = keep ? vid.currentTime : 0, wasPlaying = keep && !vid.paused;
  vid.dataset.src = src; vid.src = src;
  if (keep) vid.addEventListener("loadedmetadata", () => {
    try { vid.currentTime = Math.min(t, (vid.duration || t) - .1); } catch (e) {}
    if (wasPlaying) vid.play().catch(() => {});
  }, { once: true });
}
setVideo(wantSrc(), false);
vid.addEventListener("error", () => {           // fichier manquant : on essaie l'autre format
  if (triedAlt) return; triedAlt = true;
  setVideo(vid.dataset.src === VIDEO_V ? VIDEO_H : VIDEO_V, false);
});
let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { const s = wantSrc(); if (s !== vid.dataset.src && !triedAlt) setVideo(s, true); }, 300);
});
const SND = {
  on:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.500a5 5 0 0 1 0 7M18.500 5.500a9 9 0 0 1 0 13"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>'
};
function paintSound() {
  const on = !vid.muted;
  snd.innerHTML = on ? SND.on : SND.off;
  snd.setAttribute("aria-pressed", String(on));
  snd.setAttribute("aria-label", on ? "Couper le son" : "Activer le son");
}
if (reduce) { vid.pause(); try { vid.currentTime = .1; } catch (e) {} }

$("splash").addEventListener("click", () => {
  document.body.classList.add("gone");
  setTimeout(() => { $("splash").hidden = true; }, 800);
  if (reduce) return;
  vid.volume = .5;
  vid.muted = false;
  vid.play().catch(() => { vid.muted = true; return vid.play().catch(() => {}); }).then(paintSound);
  snd.hidden = false;
  paintSound();
});
snd.addEventListener("click", () => { vid.muted = !vid.muted; paintSound(); });

/* --- Inclinaison de la carte (souris uniquement) --- */
(function tilt() {
  if (reduce || !matchMedia("(hover: hover)").matches) return;
  const el = $("tilt");
  let raf = 0;
  addEventListener("pointermove", e => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const x = (e.clientX / innerWidth - .5) * 2;
      const y = (e.clientY / innerHeight - .5) * 2;
      el.style.transform = "perspective(900px) rotateY(" + (x * 5).toFixed(2) + "deg) rotateX(" + (-y * 5).toFixed(2) + "deg)";
    });
  });
  document.addEventListener("mouseleave", () => { el.style.transform = ""; });
})();
